:root{
  /* cold slate ink, one warm point of light */
  --ink:      #0e1319;
  --ink-lift: #161d26;
  --hair:     rgba(176,196,218,.14);
  --hair-2:   rgba(176,196,218,.065);
  --text:     #e4ecf4;
  --mute:     #8093a6;
  --dim:      #4e5d6e;
  --faint:    #37434f;
  --amber:    #ffb347;
  --amber-lo: rgba(255,179,71,.14);

  --display: Chakra, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ui:      Tight, "Inter Tight", system-ui, -apple-system, "Segoe UI", sans-serif;

  --w: 452px;
  --r: 16px;
}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

body{
  background:transparent;                 /* transparent for the Tauri shell */
  font-family:var(--ui);
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  display:flex;align-items:flex-start;justify-content:center;
  padding:env(safe-area-inset-top,0) 0 0;
  overflow:hidden;
}
/* only when opened as an ordinary web page, so it isn't invisible on white */
body.page{
  background:
    radial-gradient(1200px 680px at 15% -10%, #1c2836 0%, transparent 60%),
    radial-gradient(900px 560px at 92% 4%,  #1a232f 0%, transparent 55%),
    #070a0e;
  align-items:center;padding:30px 14px;overflow:auto;
}

/* ── shell ──────────────────────────────────────────────────────────────── */
.shell{
  width:min(var(--w),100%);
  position:relative;
  background:linear-gradient(176deg,
      color-mix(in srgb,var(--ink-lift) 88%,transparent) 0%,
      color-mix(in srgb,var(--ink) 92%,transparent) 55%);
  backdrop-filter:blur(26px) saturate(150%);
  -webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--hair);
  border-radius:var(--r);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.055),
    inset 0 -1px 0 rgba(0,0,0,.35),
    0 24px 60px -22px rgba(0,0,0,.85);
  overflow:hidden;
}
/* hairline of light along the very top edge */
.shell::before{
  content:"";position:absolute;top:0;left:14%;right:14%;height:1px;
  background:linear-gradient(90deg,transparent,rgba(255,179,71,.5),transparent);
  opacity:.65;pointer-events:none;
}

/* ── title bar ──────────────────────────────────────────────────────────── */
.bar{display:flex;align-items:center;gap:8px;padding:11px 10px 0 16px;user-select:none;-webkit-user-select:none}
.target{
  font-family:var(--display);font-size:10.5px;font-weight:500;
  letter-spacing:.08em;color:var(--dim);white-space:nowrap;
}
.target i{font-style:normal;color:var(--faint);margin:0 5px}
.grip{flex:1;height:22px}

.actions{display:flex;gap:1px}
.btn{
  width:29px;height:29px;display:grid;place-items:center;
  background:none;border:1px solid transparent;border-radius:8px;
  color:var(--dim);cursor:pointer;
  transition:color .15s,background .15s,border-color .15s;
}
.btn:hover{color:var(--text);background:rgba(255,255,255,.055);border-color:var(--hair-2)}
.btn:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.btn[aria-expanded=true]{color:var(--amber);background:var(--amber-lo);border-color:rgba(255,179,71,.26)}
.btn.danger:hover{color:#ff7a6b;background:rgba(255,122,107,.1);border-color:rgba(255,122,107,.24)}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}

/* ── readout ────────────────────────────────────────────────────────────── */
.readout{
  display:flex;align-items:flex-end;justify-content:space-between;
  padding:12px 16px 16px;user-select:none;-webkit-user-select:none;
}
.unit{display:flex;flex-direction:column;align-items:center;position:relative;padding:0 2px}
.unit + .unit{margin-left:7px;padding-left:9px}
.unit + .unit::before{
  content:"";position:absolute;left:0;top:14%;bottom:30%;width:1px;
  background:linear-gradient(180deg,transparent,var(--hair-2) 35%,var(--hair-2) 65%,transparent);
}

.slots{display:flex;font-family:var(--display);line-height:.85;letter-spacing:0}
.slot{display:block;text-align:center;overflow:hidden}
.k{
  font-family:var(--ui);font-size:8.5px;font-weight:500;
  letter-spacing:.06em;color:var(--faint);margin-top:9px;
}

/* significance weighting: years and days lead, seconds are ambient proof of life */
.u-y  .slot{font-size:36px;width:.62em;font-weight:700;color:#f2f7fc}
.u-d  .slot{font-size:36px;width:.62em;font-weight:700;color:#f2f7fc}
.u-mo .slot{font-size:27px;width:.62em;font-weight:600;color:#c2cfdc}
.u-h  .slot,
.u-mi .slot{font-size:21px;width:.62em;font-weight:600;color:#9aabbc}
.u-s  .slot{
  font-size:18px;width:.62em;font-weight:600;color:var(--amber);
  text-shadow:0 0 14px rgba(255,179,71,.42);
}
.u-y .k,.u-d .k{color:var(--dim)}
.u-s .k{color:rgba(255,179,71,.55)}

/* digits drop into place; only the ones that actually changed animate */
@keyframes drop{
  from{transform:translateY(-62%);opacity:0;filter:blur(2.5px)}
  to  {transform:none;opacity:1;filter:none}
}
.slot.roll{animation:drop .34s cubic-bezier(.22,1,.36,1)}

/* ── elapsed hairline ───────────────────────────────────────────────────── */
.track{position:relative;height:22px;border-top:1px solid var(--hair-2);display:flex;align-items:center;padding:0 16px}
.track i{
  position:absolute;left:0;top:-1px;height:1px;width:0;
  background:linear-gradient(90deg,rgba(255,179,71,0),var(--amber));
  box-shadow:0 0 8px rgba(255,179,71,.6);
}
.track b{
  font-family:var(--display);font-size:9px;font-weight:500;
  letter-spacing:.07em;color:var(--faint);margin-left:auto;
}

/* ── brief panel ────────────────────────────────────────────────────────── */
.panel{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s cubic-bezier(.32,.72,0,1)}
.panel.open{grid-template-rows:1fr}
.panel-in{overflow:hidden;border-top:1px solid var(--hair-2)}

.phead{display:flex;align-items:center;gap:8px;padding:12px 10px 10px 16px}
.phead h2{font-size:11.5px;font-weight:600;letter-spacing:.005em}
.phead time{font-family:var(--display);font-size:9.5px;color:var(--faint);margin-left:auto;letter-spacing:.06em}
.tag{
  font-family:var(--display);font-size:8.5px;letter-spacing:.09em;color:var(--amber);
  border:1px solid rgba(255,179,71,.3);border-radius:4px;padding:2px 5px 1px;
}
.refresh{
  width:24px;height:24px;display:grid;place-items:center;border:0;border-radius:6px;
  background:none;color:var(--faint);cursor:pointer;transition:color .15s,transform .4s;
}
.refresh:hover{color:var(--text)}
.refresh.spin{animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.refresh svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

.list{max-height:376px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--hair) transparent}
.list::-webkit-scrollbar{width:9px}
.list::-webkit-scrollbar-thumb{background:var(--hair);border-radius:5px;border:3px solid transparent;background-clip:padding-box}

.item{
  display:grid;grid-template-columns:20px 1fr;gap:11px;
  padding:11px 16px 12px;border-top:1px solid var(--hair-2);
  text-decoration:none;color:inherit;transition:background .13s;
}
.item:hover,.item:focus-visible{background:rgba(255,255,255,.04);outline:0}
.item:focus-visible{box-shadow:inset 2px 0 0 var(--amber)}
.rank{font-family:var(--display);font-size:10px;font-weight:600;color:var(--faint);padding-top:1px}
.item:hover .rank{color:var(--amber)}
.hl{display:block;font-size:12.5px;line-height:1.42;font-weight:500;color:var(--text)}
.sum{display:block;font-size:11.5px;line-height:1.52;color:var(--mute);margin-top:4px}
.meta{display:flex;align-items:center;gap:7px;margin-top:6px;font-size:9.5px;color:var(--faint)}
.cat{font-family:var(--display);letter-spacing:.07em;color:var(--mute)}
.dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}

.empty{padding:20px 16px 22px;font-size:11.5px;line-height:1.75;color:var(--mute)}
.empty code{font-family:var(--display);font-size:11px;color:var(--amber)}
.empty strong{color:var(--text);font-weight:600;display:block;margin-bottom:5px}

/* ── page-mode only ─────────────────────────────────────────────────────── */
.hint{
  width:min(var(--w),100%);margin-top:16px;
  font-size:11px;line-height:1.75;color:#5a6b7d;text-align:center;
}
body:not(.page) .hint{display:none}

/* Tauri: no page chrome, widget flush to the window edge */
body.tauri{padding:0}
body.tauri .shell{border-radius:var(--r);width:100%}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>

        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.5"/></svg>
      </button>
      <button class="btn danger" id="btn-close" title="Close" hidden>
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>
  </header>

  <div class="readout" id="readout" data-tauri-drag-region>
    <div class="unit u-y"  data-key="y"><div class="slots" id="s-y"></div><span class="k">years</span></div>
    <div class="unit u-mo" data-key="mo"><div class="slots" id="s-mo"></div><span class="k">months</span></div>
    <div class="unit u-d"  data-key="d"><div class="slots" id="s-d"></div><span class="k">days</span></div>
    <div class="unit u-h"  data-key="h"><div class="slots" id="s-h"></div><span class="k">hrs</span></div>
    <div class="unit u-mi" data-key="mi"><div class="slots" id="s-mi"></div><span class="k">min</span></div>
    <div class="unit u-s"  data-key="s"><div class="slots" id="s-s"></div><span class="k">sec</span></div>
  </div>

  <div class="track">
    <i id="elapsed"></i>
    <b id="pct">0.00%</b>
  </div>

  <section class="panel" id="panel">
    <div class="panel-in">
      <div class="phead">
        <h2>Daily brief</h2>
        <span class="tag" id="tag" hidden></span>
        <time id="brief-date"></time>
        <button class="refresh" id="btn-refresh" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
        </button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </section>
</div>

<p class="hint">
  Press the window icon to pop out an always-on-top floating window.
  Needs Chrome, Edge or Firefox on desktop. For a frameless transparent widget, build the Tauri app.
</p>

<script>
/* ══════════════════════════════════════════════════════════════════════════
   T-minus
   One file drives three shells: an ordinary web page, a Document
   Picture-in-Picture window, and the Tauri desktop widget.
   ══════════════════════════════════════════════════════════════════════════ */

const CFG = {
  // 6 December 2028, 00:00 IST
  target: { y: 2028, mo: 12, d: 6, h: 0, mi: 0, s: 0 },
  // anchor for the elapsed hairline
  start:  { y: 2026, mo: 9,  d: 21, h: 0, mi: 0, s: 0 },
  // set this once your GitHub Action is publishing, e.g.
  // "https://tminus-brief.pages.dev/data/latest.json"
  newsUrl: null,
};

/* ══════════════════════════════════════════════════════════════════════════
   CALENDAR MATH

   India is UTC+05:30 all year with no DST, ever. That removes the worst class
   of bug here, so shifting the epoch by +5:30 and reading the UTC fields
   gives you IST wall-clock directly.

   Y:M:D cannot come from a millisecond delta, because months aren't a fixed
   length. Find the largest whole month count M where now + M months <= target,
   then measure the flat remainder. Anchoring at `now` rather than counting
   back from the target is a deliberate convention; the two disagree at month
   ends. Under this one, 31 Jan to 28 Feb reads as exactly 1 month.
   ══════════════════════════════════════════════════════════════════════════ */
const IST = 330 * 60000;

const ist     = ms => new Date(ms + IST);
const fromIst = (y, mo, d, h, mi, s) => Date.UTC(y, mo - 1, d, h, mi, s) - IST;
const dim     = (y, mo) => new Date(Date.UTC(y, mo, 0)).getUTCDate();

function addMonths(baseMs, k) {
  const b = ist(baseMs);
  let y = b.getUTCFullYear();
  let mo = b.getUTCMonth() + 1 + k;
  y += Math.floor((mo - 1) / 12);
  mo = ((mo - 1) % 12 + 12) % 12 + 1;
  return fromIst(y, mo, Math.min(b.getUTCDate(), dim(y, mo)),
                 b.getUTCHours(), b.getUTCMinutes(), b.getUTCSeconds());
}

function breakdown(nowMs, targetMs) {
  if (targetMs <= nowMs) return { y:0, mo:0, d:0, h:0, mi:0, s:0, done:true };

  const n = ist(nowMs), t = ist(targetMs);
  let m = (t.getUTCFullYear() - n.getUTCFullYear()) * 12
        + (t.getUTCMonth()    - n.getUTCMonth());
  if (m < 0) m = 0;
  while (m > 0 && addMonths(nowMs, m) > targetMs) m--;
  while (addMonths(nowMs, m + 1) <= targetMs) m++;

  let r = targetMs - addMonths(nowMs, m);   // exact: IST has no DST
  const d  = Math.floor(r / 86400000); r -= d  * 86400000;
  const h  = Math.floor(r /  3600000); r -= h  *  3600000;
  const mi = Math.floor(r /    60000); r -= mi *    60000;
  const s  = Math.floor(r /     1000);

  return { y: Math.floor(m / 12), mo: m % 12, d, h, mi, s, done:false };
}

const T = CFG.target, S = CFG.start;
const TARGET_MS = fromIst(T.y, T.mo, T.d, T.h, T.mi, T.s);
const START_MS  = fromIst(S.y, S.mo, S.d, S.h, S.mi, S.s);

/* ══════════════════════════════════════════════════════════════════════════
   DIGIT SLOTS
   One element per digit at a fixed width, so nothing shifts as values change
   regardless of whether the typeface has tabular figures. Only the digits
   that actually changed get re-animated.
   ══════════════════════════════════════════════════════════════════════════ */
const WIDTHS = { y:3, mo:2, d:2, h:2, mi:2, s:2 };
let root = document;
let slots = {};

function buildSlots() {
  slots = {};
  for (const key of Object.keys(WIDTHS)) {
    const host = root.getElementById('s-' + key);
    if (!host) continue;
    host.textContent = '';
    slots[key] = [];
    for (let i = 0; i < WIDTHS[key]; i++) {
      const el = root.createElement('span');
      el.className = 'slot';
      el.textContent = '0';
      host.appendChild(el);
      slots[key].push({ el, v: null });
    }
  }
}

function paint(key, value) {
  const str = String(value).padStart(WIDTHS[key], '0');
  const row = slots[key];
  if (!row) return;
  for (let i = 0; i < row.length; i++) {
    const ch = str[i];
    if (row[i].v === ch) continue;
    row[i].v = ch;
    const el = row[i].el;
    el.textContent = ch;
    el.classList.remove('roll');
    void el.offsetWidth;              // restart the animation
    el.classList.add('roll');
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   TICK

   Never setInterval(1000) with a decrementing counter. It drifts, background
   tabs get throttled to roughly once a minute, and laptop sleep destroys it.
   Recompute from Date.now() every time and realign the next tick to the wall
   second so error can't accumulate.
   ══════════════════════════════════════════════════════════════════════════ */
let timer = null;

function render() {
  const b = breakdown(Date.now(), TARGET_MS);
  paint('y', b.y); paint('mo', b.mo); paint('d', b.d);
  paint('h', b.h); paint('mi', b.mi); paint('s', b.s);

  const frac = Math.min(1, Math.max(0, (Date.now() - START_MS) / (TARGET_MS - START_MS)));
  const bar = root.getElementById('elapsed');
  const pct = root.getElementById('pct');
  if (bar) bar.style.width = (frac * 100).toFixed(4) + '%';
  if (pct) pct.textContent = (frac * 100).toFixed(2) + '%';
}

function loop() {
  render();
  clearTimeout(timer);
  timer = setTimeout(loop, 1000 - (Date.now() % 1000) + 4);
}

['visibilitychange', 'focus', 'pageshow'].forEach(ev =>
  window.addEventListener(ev, () => { if (!document.hidden) loop(); })
);

/* ══════════════════════════════════════════════════════════════════════════
   DAILY BRIEF
   Stale-while-revalidate. Paint the cache instantly, refresh behind it, so
   opening the panel never shows a spinner. Prefetched on load, not on click.
   ══════════════════════════════════════════════════════════════════════════ */
const CACHE_KEY = 'tminus.brief.v1';
let brief = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function readCache() { try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch { return null; } }
function writeCache(d) { try { localStorage.setItem(CACHE_KEY, JSON.stringify(d)); } catch {} }

async function loadBrief(force) {
  if (!brief) { brief = readCache(); paintBrief(); }
  if (!CFG.newsUrl) { paintBrief(); return; }

  const btn = root.getElementById('btn-refresh');
  if (btn) btn.classList.add('spin');
  try {
    const res = await fetch(CFG.newsUrl + (force ? '?t=' + Date.now() : ''), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    if (data && Array.isArray(data.items)) { brief = data; writeCache(data); paintBrief(); }
  } catch {
    /* keep whatever the cache had; an offline widget should still show yesterday */
  } finally {
    if (btn) btn.classList.remove('spin');
  }
}

function paintBrief() {
  const list = root.getElementById('list');
  const time = root.getElementById('brief-date');
  const tag  = root.getElementById('tag');
  if (!list) return;

  if (!brief || !brief.items || !brief.items.length) {
    if (tag) tag.hidden = true;
    if (time) time.textContent = '';
    list.innerHTML =
      '<div class="empty"><strong>No brief connected yet.</strong>' +
      'Set <code>newsUrl</code> in <code>app.js</code> to your published endpoint. ' +
      'Expected shape: <code>{ date, items: [ { title, summary, source, url, category } ] }</code></div>';
    return;
  }

  if (tag) { tag.hidden = !brief.label; tag.textContent = brief.label || ''; }
  if (time) time.textContent = brief.date || '';

  list.innerHTML = brief.items.slice(0, 10).map((it, i) => `
    <a class="item" href="${esc(it.url || '#')}" target="_blank" rel="noopener noreferrer">
      <span class="rank">${String(i + 1).padStart(2, '0')}</span>
      <span>
        <span class="hl">${esc(it.title)}</span>
        ${it.summary ? `<span class="sum">${esc(it.summary)}</span>` : ''}
        <span class="meta">
          ${it.category ? `<span class="cat">${esc(it.category)}</span><i class="dot"></i>` : ''}
          <span>${esc(it.source)}</span>
        </span>
      </span>
    </a>`).join('');
}

/* ══════════════════════════════════════════════════════════════════════════
   TAURI BRIDGE
   The window is sized to the collapsed pill. Grow it before expanding the
   panel and shrink it after collapsing, so content is never clipped mid
   transition.
   ══════════════════════════════════════════════════════════════════════════ */
const isTauri = () => typeof window.__TAURI__ !== 'undefined';
const COLLAPSED = 132;
const EXPANDED  = 556;

async function tauriResize(h) {
  if (!isTauri()) return;
  try { await window.__TAURI__.core.invoke('resize_height', { h }); } catch {}
}

async function setOpen(open) {
  const panel = root.getElementById('panel');
  const btn   = root.getElementById('btn-news');
  if (!panel) return;
  if (open) {
    await tauriResize(EXPANDED);
    panel.classList.add('open');
  } else {
    panel.classList.remove('open');
    setTimeout(() => tauriResize(COLLAPSED), 310);
  }
  if (btn) btn.setAttribute('aria-expanded', String(open));
}

/* ══════════════════════════════════════════════════════════════════════════
   DOCUMENT PICTURE-IN-PICTURE
   A genuine OS-level always-on-top window built from arbitrary HTML.
   Chrome and Edge 130+, Firefox has shipped it. Not available on Android.
   ══════════════════════════════════════════════════════════════════════════ */
async function openPip() {
  if (!('documentPictureInPicture' in window)) {
    const list = root.getElementById('list');
    if (list) list.innerHTML =
      '<div class="empty"><strong>Floating window unavailable here.</strong>' +
      'This browser has no Document Picture-in-Picture support. Use Chrome, Edge or ' +
      'Firefox on desktop, or build the Tauri app for a frameless transparent widget.</div>';
    setOpen(true);
    return;
  }

  const pip = await documentPictureInPicture.requestWindow({ width: 470, height: 176 });

  for (const node of document.head.querySelectorAll('style,link[rel="stylesheet"]')) {
    pip.document.head.appendChild(node.cloneNode(true));
  }
  pip.document.title = 'T-minus';
  pip.document.body.className = '';

  const shell  = document.getElementById('shell');
  const anchor = document.createComment('tminus');
  shell.replaceWith(anchor);
  pip.document.body.appendChild(shell);

  root = pip.document;
  mount();

  pip.addEventListener('pagehide', () => {
    anchor.replaceWith(shell);
    root = document;
    mount();
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   MOUNT
   ══════════════════════════════════════════════════════════════════════════ */
function mount() {
  buildSlots();

  const news = root.getElementById('btn-news');
  if (news) news.onclick = () => setOpen(!root.getElementById('panel').classList.contains('open'));

  const pip = root.getElementById('btn-pip');
  if (pip) pip.onclick = openPip;

  const ref = root.getElementById('btn-refresh');
  if (ref) ref.onclick = () => loadBrief(true);

  const close = root.getElementById('btn-close');
  if (close) {
    close.hidden = !isTauri();
    close.onclick = () => window.__TAURI__.core.invoke('hide_widget');
  }

  paintBrief();
  loop();
}

if (isTauri()) {
  document.body.classList.remove('page');
  document.body.classList.add('tauri');
  const p = document.querySelector('.hint');
  if (p) p.remove();
}

mount();
loadBrief();

</script>
</body>
</html>

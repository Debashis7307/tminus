[package]
name        = "tminus"
version     = "1.0.0"
description = "A floating countdown widget"
edition     = "2021"
rust-version = "1.77"

[lib]
name       = "tminus_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri                       = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-autostart      = "2"
tauri-plugin-global-shortcut = "2"
serde                       = { version = "1", features = ["derive"] }
serde_json                  = "1"

[profile.release]
opt-level = "s"
lto       = true
codegen-units = 1
panic     = "abort"
strip     = true

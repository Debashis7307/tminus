<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>T-minus</title>
<link rel="stylesheet" href="./style.css">
</head>
<body class="page">

<div class="shell" id="shell">

  <!-- compact pill: news icon | countdown digits | float icon -->
  <div class="pill" data-tauri-drag-region>

    <button class="btn" id="btn-news" aria-expanded="false" aria-controls="panel" title="Daily brief">
      <svg viewBox="0 0 24 24"><path d="M4 5.5h10.5a1 1 0 0 1 1 1v11a1 1 0 0 0 1 1H6.5a2.5 2.5 0 0 1-2.5-2.5V5.5Z"/><path d="M15.5 9.5H19a1 1 0 0 1 1 1v6a2 2 0 0 1-2 2"/><path d="M7 9h6M7 12h6M7 15h4"/></svg>
    </button>

    <div class="readout" id="readout" data-tauri-drag-region>
      <div class="unit u-y" ><div class="slots" id="s-y" ></div><span class="k">y</span></div>
      <div class="unit u-mo"><div class="slots" id="s-mo"></div><span class="k">mo</span></div>
      <div class="unit u-d" ><div class="slots" id="s-d" ></div><span class="k">d</span></div>
      <span class="vbar"></span>
      <div class="unit u-h" ><div class="slots" id="s-h" ></div><span class="k">h</span></div>
      <div class="unit u-mi"><div class="slots" id="s-mi"></div><span class="k">m</span></div>
      <div class="unit u-s" ><div class="slots" id="s-s" ></div><span class="k">s</span></div>
    </div>

    <div class="actions">
      <button class="btn" id="btn-pip" title="Float above all windows">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.5"/></svg>
      </button>
      <button class="btn danger" id="btn-close" title="Close" hidden>
        <svg viewBox="0 0 24 24"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/></svg>
      </button>
    </div>

  </div>

  <!-- 2px amber progress hairline -->
  <div class="track"><i id="elapsed"></i></div>

  <!-- news panel, hidden until icon clicked -->
  <section class="panel" id="panel">
    <div class="panel-in">
      <div class="phead">
        <h2>Daily brief</h2>
        <span class="tag" id="tag" hidden></span>
        <time id="brief-date"></time>
        <button class="refresh" id="btn-refresh" title="Refresh">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v4.5h-4.5"/></svg>
        </button>
      </div>
      <div class="list" id="list"></div>
    </div>
  </section>

</div>

<!-- page-mode only: float CTA -->
<div class="page-cta">
  <button id="page-float-btn">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><rect x="11.5" y="11" width="7.5" height="6" rx="1.5"/></svg>
    Float above everything
  </button>
  <p>Chrome / Edge / Firefox on desktop &mdash; or build the Tauri app for a native transparent widget</p>
</div>

<script src="./app.js"></script>
</body>
</html>
